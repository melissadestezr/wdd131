<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Melissa Destez">
    <meta name="description" content="A responsive temple photo album showcasing Latter-day Saint temples around the world, built with HTML, CSS Grid, and JavaScript.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
    <title>Temples Album</title>
</head>
<body>
    <header>
        <h2 class="site-title">Temple Album</h2>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a hrerf="#">Small</a></li>
            </ul>
        </nav>
    </header>
    <main>
            <h1 id="gallery-title">Home</h1>
        <div class="gallery">
 
            <figure data-tags="old large">
                <img src="images/temple.png" alt="Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
 
            <figure data-tags="new large">
                <img src="images/temple.png" alt="Rome Italy Temple" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
 
            <figure data-tags="old small">
                <img src="images/temple.png" alt="Cardston Alberta Temple" loading="lazy">
                <figcaption>Cardston Alberta Temple</figcaption>
            </figure>
 
            <figure data-tags="new small">
                <img src="images/temple.png" alt="Brasília Brazil Temple" loading="lazy">
                <figcaption>Brasília Brazil Temple</figcaption>
            </figure>
 
            <figure data-tags="old large">
                <img src="images/temple.png" alt="Mesa Arizona Temple" loading="lazy">
                <figcaption>Mesa Arizona Temple</figcaption>
            </figure>
 
            <figure data-tags="new large">
                <img src="images/temple.png" alt="San Diego California Temple" loading="lazy">
                <figcaption>San Diego California Temple</figcaption>
            </figure>
 
            <figure data-tags="new small">
                <img src="images/temples-large.png" alt="Manaus Brazil Temple" loading="lazy">
                <figcaption>Manaus Brazil Temple</figcaption>
            </figure>
 
            <figure data-tags="old small">
                <img src="images/temple.png" alt="Idaho Falls Temple" loading="lazy">
                <figcaption>Idaho Falls Temple</figcaption>
            </figure>
 
            <figure data-tags="new large">
                <img src="images/temple.png" alt="Paris France Temple" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>
 
        </div>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> ⭐ Melissa Destez ⭐ São Paulo, Brazil </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
